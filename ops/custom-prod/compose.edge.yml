name: sub2api-edge

# Long-lived public entry point. Application deployment must not recreate it.
services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: sub2api-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    command:
      - /bin/sh
      - -ec
      - |
        (while :; do
          sleep 6h
          nginx -t && nginx -s reload
        done) &
        exec nginx -g 'daemon off;'
    volumes:
      - type: bind
        source: ${SUB2API_DATA_ROOT:-/srv/sub2api}/config/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${SUB2API_DATA_ROOT:-/srv/sub2api}/certbot/www
        target: /var/www/certbot
        read_only: true
      - type: bind
        source: ${SUB2API_DATA_ROOT:-/srv/sub2api}/certbot/letsencrypt
        target: /etc/letsencrypt
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - backend

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    container_name: sub2api-certbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        while :; do
          certbot renew \
            --webroot \
            --webroot-path /var/www/certbot \
            --quiet
          sleep 12h
        done
    environment:
      SUB2API_DOMAIN: ${SUB2API_DOMAIN:?SUB2API_DOMAIN is required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
    volumes:
      - type: bind
        source: ${SUB2API_DATA_ROOT:-/srv/sub2api}/certbot/www
        target: /var/www/certbot
      - type: bind
        source: ${SUB2API_DATA_ROOT:-/srv/sub2api}/certbot/letsencrypt
        target: /etc/letsencrypt

networks:
  backend:
    name: sub2api-backend
    external: true

