name: Custom production deploy

on:
  push:
    branches:
      - custom/prod
  workflow_dispatch:

concurrency:
  group: custom-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/alphacall-ai/sub2api

jobs:
  build:
    name: Build production image
    if: github.repository == 'alphacall-AI/sub2api' && github.ref == 'refs/heads/custom/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout custom/prod
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:prod
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=custom-prod
          cache-to: type=gha,mode=max,scope=custom-prod

  deploy:
    name: Deploy production application
    needs: build
    if: github.repository == 'alphacall-AI/sub2api' && github.ref == 'refs/heads/custom/prod'
    runs-on: [self-hosted, linux, x64, sub2api-prod]
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      PROD_IMAGE: ghcr.io/alphacall-ai/sub2api@${{ needs.build.outputs.digest }}
      PROD_ENV_FILE: /srv/sub2api/config/prod.env
      PROD_COMPOSE_FILE: ops/custom-prod/compose.app.yml
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify production infrastructure
        shell: bash
        run: |
          set -Eeuo pipefail
          test -r "${PROD_ENV_FILE}"
          test "$(docker inspect --format '{{.State.Health.Status}}' sub2api-postgres)" = "healthy"
          test "$(docker inspect --format '{{.State.Health.Status}}' sub2api-redis)" = "healthy"

      - name: Back up PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          backup_time="$(date -u +%Y%m%d-%H%M%S)"
          backup_file="/srv/sub2api/backups/sub2api-${backup_time}-${GITHUB_SHA:0:12}.dump"
          docker exec sub2api-postgres pg_dump \
            --username sub2api \
            --dbname sub2api \
            --format custom \
            > "${backup_file}"
          test -s "${backup_file}"
          echo "Database backup created: ${backup_file}"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Deploy image by immutable digest
        shell: bash
        run: |
          set -Eeuo pipefail
          export SUB2API_IMAGE="${PROD_IMAGE}"
          docker compose \
            --env-file "${PROD_ENV_FILE}" \
            --file "${PROD_COMPOSE_FILE}" \
            pull sub2api
          docker compose \
            --env-file "${PROD_ENV_FILE}" \
            --file "${PROD_COMPOSE_FILE}" \
            up --detach --no-deps --wait --wait-timeout 240 sub2api
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 \
            https://app.vibetools.ai/health \
            > /dev/null

      - name: Show application logs on failure
        if: failure()
        shell: bash
        run: docker logs --tail 200 sub2api-prod || true

      - name: Log out from GitHub Container Registry
        if: always()
        shell: bash
        run: docker logout ghcr.io || true

